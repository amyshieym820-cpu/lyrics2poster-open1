name: collect-charts
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch charts from Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          L2P_CHARTS: ${{ vars.L2P_CHARTS || 'global;South Korea;United States' }}
        run: python scripts/collect_charts.py
      - name: Commit changes
        run: |
          git config user.name "chart-bot"
          git config user.email "chart-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update charts $(date -u +%F)"
          git push
